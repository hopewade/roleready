<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoleReady</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7ef;color:#304828;font:600 16px system-ui,sans-serif}
main{text-align:center;padding:24px}
h1{margin:0 0 12px;font-size:32px}
p{margin:0;font-weight:400}
</style>
</head>
<body>
<main aria-live="polite"><h1>RoleReady</h1><p id="status">正在加载求职练习…</p></main>
<script>
async function loadRoleReady() {
  const paths = ["./release/page-01.txt", "./release/page-02.txt", "./release/page-03.txt", "./release/page-04.txt", "./release/page-05.txt", "./release/page-06.txt", "./release/page-07.txt", "./release/page-08.txt", "./release/page-09.txt"];
  const buffers = await Promise.all(paths.map(async (path) => {
    const response = await fetch(path);
    if (!response.ok) throw new Error('Release asset returned ' + response.status);
    return response.arrayBuffer();
  }));
  const decoder = new TextDecoder('utf-8', { fatal: true });
  const page = buffers.map((buffer) => decoder.decode(buffer, { stream: true })).join('') + decoder.decode();
  document.open();
  document.write(page);
  document.close();
}
loadRoleReady().catch(() => {
  document.getElementById('status').textContent = '网页加载失败，请刷新重试。';
});
</script>
</body>
</html>
